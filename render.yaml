services:
  - type: web
    name: imgsheet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: IMGSHEET_SEARCH_WORKERS
        value: "2"
      - key: IMGSHEET_DOWNLOAD_WORKERS
        value: "2"
      - key: SERPAPI_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASS
        sync: false
